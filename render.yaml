services:
  # ── Next.js Web Service ───────────────────────────────────────────────────
  - type: web
    name: internhub
    runtime: node
    region: singapore          # closest to India — change to oregon/ohio if preferred
    plan: free                 # upgrade to starter ($7/mo) for always-on
    buildCommand: npm ci && npm run build:prod
    startCommand: npm run start
    healthCheckPath: /

    envVars:
      # ── Set in Render Dashboard → Environment ────────────────────────────
      # Do NOT put real secrets here; reference them from the dashboard.
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: internhub-db
          property: connectionString

      # JWT / Session — generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false

      # App URL — set after first deploy (e.g. https://internhub.onrender.com)
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false

      # Email (SMTP / Gmail App Password)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # OTP config
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: OTP_MAX_ATTEMPTS
        value: "5"

      # Payment window bypass — set to "true" only for dev/staging, never production
      - key: PAYMENT_WINDOW_BYPASS_DEV
        value: "false"

  # ── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: internhub-db
    databaseName: internhub
    user: internhub
    plan: free                 # 90-day free tier; upgrade to starter ($7/mo) after
    region: singapore
